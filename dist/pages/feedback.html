<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Foto Analisada</title>
</head>
<body class="min-h-screen bg-linear-to-b from-royal-blue-100 via-white to-royal-blue-100">
    <header class="sticky top-0 z-30 bg-royal-blue-100/85 backdrop-blur-md border-b border-line">
        <div class="mx-auto max-w-98 h-18 px-5 flex items-center justify-between gap-3">
            <a href="./galeria.html" aria-label="Voltar para a galeria" class="w-11 h-11 rounded-2xl bg-white ring-1 ring-line shadow-card flex items-center justify-center text-royal-blue-700 transition-colors hover:bg-royal-blue-100">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </a>

            <p class="flex items-center gap-1.5 text-[11px] font-bold text-royal-blue-700 bg-white px-3 py-1.5 rounded-full ring-1 ring-line">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
                </svg>
                Análise Completa
            </p>
        </div>
    </header>

    <!-- Os cards de sugestão são gerados pelo feedback.js a partir dos dados do data.js -->
    <main class="mx-auto max-w-98 px-5 py-6 pb-44">
        <h1 class="text-2xl font-extrabold tracking-tight text-center leading-tight">Foto Analisada!</h1>

        <p class="mx-auto mt-2 mb-5 w-fit flex items-center gap-1.5 text-[11px] font-bold text-royal-blue-700 bg-royal-blue-100 px-3 py-1.5 rounded-full">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2.5l2.9 5.88 6.49.95-4.7 4.58 1.11 6.46L12 17.33l-5.8 3.04 1.11-6.46-4.7-4.58 6.49-.95L12 2.5z" />
            </svg>
            IA aplicada
        </p>

        <figure id="photo" class="hidden mb-5">
            <img id="photo-image" src="" alt="" class="w-full h-52 object-cover rounded-3xl shadow-card ring-1 ring-line">
            <figcaption class="mt-2 text-center text-xs text-muted"><span id="photo-title"></span> · <span id="photo-tag"></span></figcaption>
        </figure>

        <section id="suggestions" class="bg-white rounded-3xl shadow-card ring-1 ring-line p-4 flex flex-col gap-4"></section>
    </main>

    <div class="fixed inset-x-0 bottom-0 z-40">
        <div class="mx-auto max-w-98">
            <div class="px-5 pb-4 flex items-center gap-3">
                <button id="btn-share" type="button" class="flex-1 flex items-center justify-center gap-2 h-12 rounded-full bg-white ring-1 ring-line shadow-card text-sm font-bold text-ink cursor-pointer transition-colors hover:bg-royal-blue-100">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185z" />
                    </svg>
                    <span id="btn-share-label">Compartilhar</span>
                </button>

                <button id="btn-back" type="button" class="flex-1 h-12 rounded-full bg-linear-to-r from-royal-blue-700 to-royal-blue-500 shadow-float text-sm font-extrabold text-white cursor-pointer transition-transform duration-200 hover:-translate-y-px active:scale-99">
                    Voltar
                </button>
            </div>

            <nav class="h-18 bg-white/95 backdrop-blur-md border-t border-line rounded-t-3xl shadow-card flex items-center justify-around">
                <a href="./menu.html" class="flex flex-col items-center gap-1 w-20 text-muted transition-colors hover:text-royal-blue-700">
                    <span class="flex items-center justify-center w-12 h-7 rounded-full">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0" />
                        </svg>
                    </span>
                    <span class="text-[11px] font-semibold">Tutoriais</span>
                </a>

                <a href="./galeria.html" aria-current="page" class="flex flex-col items-center gap-1 w-20 text-royal-blue-700 transition-colors hover:text-royal-blue-800">
                    <span class="flex items-center justify-center w-12 h-7 rounded-full bg-royal-blue-100">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
                        </svg>
                    </span>
                    <span class="text-[11px] font-bold">Galeria</span>
                </a>

                <a href="#" class="flex flex-col items-center gap-1 w-20 text-muted transition-colors hover:text-royal-blue-700">
                    <span class="flex items-center justify-center w-12 h-7 rounded-full">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0zM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </span>
                    <span class="text-[11px] font-semibold">Perfil</span>
                </a>
            </nav>
        </div>
    </div>

    <script src="../../data.js"></script>
    <script src="../js/feedback.js"></script>
</body>
</html>
