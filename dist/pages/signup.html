<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Cadastro</title>
</head>
<body class="min-h-screen bg-linear-to-b from-royal-blue-100 via-white to-royal-blue-100 flex items-center justify-center px-5 py-10">
    <div class="w-full max-w-88">
        <div class="rounded-4xl overflow-hidden shadow-card">
            <img src="../images/login-bg.png" alt="" class="w-full">
        </div>

        <form id="form" method="POST" class="relative -mt-14 bg-white rounded-4xl shadow-card ring-1 ring-line px-6 py-8">
            <h1 class="text-2xl font-extrabold tracking-tight bg-linear-to-r from-royal-blue-700 to-royal-blue-500 bg-clip-text text-transparent">JOVI CAMERA GUIDE</h1>
            <p class="text-sm text-muted mb-8">Crie a sua conta :)</p>

            <div class="flex gap-3 mb-4">
                <div class="w-[70%]">
                    <label for="name" class="block text-sm font-semibold mb-1.5"><span class="text-red-600">*</span> Nome</label>
                    <div class="input-field">
                        <input id="name" name="name" placeholder="Digite seu nome">
                    </div>
                </div>

                <div class="w-[30%]">
                    <label for="age" class="block text-sm font-semibold mb-1.5"><span class="text-red-600">*</span> Idade</label>
                    <div class="input-field">
                        <input id="age" name="age" type="number" placeholder="Idade">
                    </div>
                </div>
            </div>

            <label class="block text-sm font-semibold mb-1.5" for="email"><span class="text-red-600">*</span> E-mail</label>
            <div class="input-field mb-4">
                <img src="../images/envelope-solid-full.svg" alt="" class="w-5 h-5 opacity-60">
                <input id="email" name="email" type="email" placeholder="Coloque o seu e-mail">
            </div>

            <label class="block text-sm font-semibold mb-1.5" for="password"><span class="text-red-600">*</span> Senha</label>
            <div class="input-field mb-5">
                <img src="../images/lock-solid-full.svg" alt="" class="w-5 h-5 opacity-60">
                <input id="password" name="password" type="password" placeholder="Coloque a sua senha">
            </div>

            <div class="flex items-center gap-3 mb-6">
                <input id="terms" type="checkbox" class="w-4 h-4 accent-royal-blue-700 cursor-pointer">
                <label for="terms" class="text-sm text-muted cursor-pointer">Eu aceito os <span class="font-semibold text-ink">Termos</span> e <span class="font-semibold text-ink">Condições</span>.</label>
            </div>

            <p id="message" class="text-sm text-center mb-4"></p>

            <button id="register-btn" class="btn-primary mb-5">Criar Conta</button>

            <p class="text-sm text-center text-muted">Já tem uma conta? <a href="./login.html" class="font-bold text-royal-blue-700 hover:underline">Entrar!</a></p>
        </form>
    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
