<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Cadastro</title>
</head>
<body class="bg-royal-blue-100 min-h-screen grid place-items-center px-6">
     <div class="w-full max-w-[375px] mt-8">
        <div>
            <img src="../images/login-bg.png" alt="Imagem de fundo login" class="w-full">
        </div>

        <form id="form" method="POST" class="bg-white px-5 py-6 -translate-y-14 rounded-4xl flex flex-col">
            <h1 class="text-2xl font-bold text-royal-blue-700">JOVI CAMERA GUIDE</h1>
            <p class="mb-12 font-medium">Crie a sua conta :)</p>

            <div class="flex gap-2 mb-4">
               <div class="w-[75%]">
                    <label for="name" class="font-semibold"><span class="text-red-600 font-semibold">*</span>Nome</label>
                    <input id="name" name="name" placeholder="Digite seu nome" class=" w-full focus:outline-none focus:ring-0 focus:border-0  bg-[#ECECEC] gap-3 items-center px-2 py-2.5 rounded-lg">
               </div>

               <div class="w-[25%]">
                    <label for="age" class="font-semibold"><span class="text-red-600 font-semibold">*</span>Idade</label>
                    <input id="age" name="age" type="number" placeholder="Idade" class="w-full focus:outline-none focus:ring-0 focus:border-0  bg-[#ECECEC] gap-3 items-center px-2 py-2.5 rounded-lg">
               </div>
            </div>

            <label class="font-semibold" for="email"><span class="text-red-600 font-semibold">*</span>E-mail:</label>
            <div class="flex mb-4 bg-[#ECECEC] w-full gap-3 items-center px-2 py-2.5 rounded-lg">
                <img src="../images/envelope-solid-full.svg" alt="e-mail icone" class="w-6 h-6">
                <input id="email" name="email" type="email" placeholder="Coloque o seu e-mail" class="w-full focus:outline-none focus:ring-0 focus:border-0">
            </div>

            <label class="font-semibold" for="password"><span class="text-red-600 font-semibold">*</span>Senha:</label>
            <div class="flex mb-4  bg-[#ECECEC] w-full gap-3 items-center px-2 py-2.5 rounded-lg">
                <img src="../images/lock-solid-full.svg" alt="e-mail icone" class="w-6 h-6">
                <input id="password" name="password" type="password" placeholder="Coloque a sua senha" class="w-full focus:outline-none focus:ring-0 focus:border-0">
            </div>

            <div class=" flex flex-start gap-3 items-center mb-4">
                <input id="terms" type="checkbox" class="w-4 h-4"/>
                <p>Eu aceito com os <span class="font-semibold">Termos</span> e <span class="font-semibold">Condições</span>.</p>
            </div>

            <p id="message"class="text-sm text-center mb-8"></p>

            <button id="register-btn" class="block bg-linear-to-r from-royal-blue-700 to-royal-blue-500 w-full py-3 rounded-4xl mb-4 hover:opacity-70 hover:cursor-pointer">
                <p class="inline-block text-base text-white font-extrabold">Criar Conta</p>
            </button>

            <p class="text-sm text-center mb-4">Já tem uma conta? <span class="text-royal-blue-700 font-bold"><a href="./login.html">Entrar!</a></span></p>
        </form>
    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
