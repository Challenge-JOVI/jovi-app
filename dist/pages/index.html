<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Jovi App</title>
</head>
<body class="relative min-h-screen overflow-hidden bg-linear-to-b from-royal-blue-900 via-royal-blue-700 to-royal-blue-600">
    <div class="pointer-events-none absolute -top-32 -left-24 w-96 h-96 rounded-full bg-royal-blue-400/30 blur-3xl" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -bottom-40 -right-24 w-96 h-96 rounded-full bg-royal-blue-500/40 blur-3xl" aria-hidden="true"></div>

    <div class="relative mx-auto max-w-98 min-h-screen px-8 py-14 flex flex-col items-center justify-between text-center">
        <header>
            <img src="../images/logo.png" alt="Logo JOVI" class="w-20">
        </header>

        <main class="flex flex-col items-center gap-4">
            <h1 class="text-3xl font-extrabold tracking-tight leading-snug text-white max-w-80">JOVI Camera Guide</h1>
            <p class="text-white/70 leading-relaxed max-w-72">Aprenda a tirar o máximo da câmera do seu celular.</p>
        </main>

        <div class="w-full flex flex-col items-center gap-4">
            <a href="./onboarding.html" class="btn-outline">Começar</a>
            <a href="./login.html" class="text-sm font-semibold text-white/80 underline transition-colors hover:text-white">Já tenho uma conta</a>
        </div>
    </div>
</body>
</html>
