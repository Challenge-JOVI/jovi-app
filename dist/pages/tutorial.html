<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Tutorial</title>
</head>
<body class="min-h-screen bg-linear-to-b from-royal-blue-100 via-white to-royal-blue-100">
    <header class="sticky top-0 z-30 bg-royal-blue-100/85 backdrop-blur-md border-b border-line">
        <div class="mx-auto max-w-98 h-18 px-5 flex items-center gap-3">
            <a href="./menu.html" aria-label="Voltar para o menu" class="w-11 h-11 rounded-2xl bg-white ring-1 ring-line shadow-card flex items-center justify-center text-royal-blue-700 transition-colors hover:bg-royal-blue-100">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </a>

            <p class="text-xs text-muted">Tutorial</p>
        </div>
    </header>

    <main class="mx-auto max-w-98 px-5 py-6 pb-10">
        <section class="bg-white rounded-3xl shadow-card ring-1 ring-line p-4">
            <div class="flex items-center gap-3 mb-4">
                <div id="imageContainer" class="w-11 h-11 rounded-2xl bg-linear-to-br from-royal-blue-700 to-royal-blue-500 shadow-float flex items-center justify-center shrink-0"></div>

                <h1 id="title" class="flex-1 font-extrabold uppercase tracking-tight text-sm"></h1>

                <p id="steps-n" class="text-[11px] font-bold text-royal-blue-700 bg-royal-blue-100 px-3 py-1.5 rounded-full shrink-0"></p>
            </div>

            <div class="rounded-2xl overflow-hidden mb-5">
                <img id="stepImage" src="" alt="Imagem da etapa" class="w-full h-88 object-cover">
            </div>

            <div id="steps" class="flex items-center gap-2 justify-center mb-6"></div>

            <div class="px-1 mb-8">
                <h2 id="descTitle" class="text-lg font-extrabold tracking-tight mb-2"></h2>
                <p id="desc" class="rich-text text-sm text-muted leading-relaxed whitespace-pre-line"></p>
            </div>

            <button id="btn-next" class="btn-primary">
                <span id="btn-label">Avançar</span>
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
            </button>
        </section>
    </main>

    <script src="../../data.js"></script>
    <script src="../js/tutorial.js"></script>
</body>
</html>
