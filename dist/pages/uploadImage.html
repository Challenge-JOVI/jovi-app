<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Envie sua foto</title>
</head>
<body class="min-h-screen bg-linear-to-b from-royal-blue-100 via-white to-royal-blue-100">
    <header class="sticky top-0 z-30 bg-royal-blue-100/85 backdrop-blur-md border-b border-line">
        <div class="mx-auto max-w-98 h-18 px-5 flex items-center gap-3">
            <a href="./galeria.html" aria-label="Voltar para a galeria" class="w-11 h-11 rounded-2xl bg-white ring-1 ring-line shadow-card flex items-center justify-center text-royal-blue-700 transition-colors hover:bg-royal-blue-100">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </a>

            <div>
                <h1 class="font-extrabold tracking-tight leading-tight">Envie sua foto</h1>
                <p class="text-xs text-muted leading-tight">Sugestões inteligentes para sua foto</p>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-98 px-5 py-6 pb-32">
        <input id="input-file" type="file" accept="image/*" class="sr-only peer">

        <label for="input-file" class="block cursor-pointer rounded-3xl border-2 border-dashed border-royal-blue-300 bg-white/70 px-6 py-16 text-center transition-all duration-200 hover:border-royal-blue-500 hover:bg-white hover:shadow-card peer-focus-visible:border-royal-blue-500 peer-focus-visible:ring-4 peer-focus-visible:ring-royal-blue-200">
            <span class="mx-auto mb-5 flex w-16 h-16 items-center justify-center rounded-full bg-royal-blue-100 ring-8 ring-royal-blue-100/40">
                <svg class="w-7 h-7 text-royal-blue-700" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12L12 7.5 7.5 12M12 7.5V21" />
                </svg>
            </span>

            <span class="block text-lg font-extrabold tracking-tight text-royal-blue-700 mb-1">Faça o upload da sua foto</span>
            <span class="block text-sm text-muted leading-relaxed mb-10">A IA irá analisar e sugerir o melhor das funcionalidades JOVI!</span>

            <span class="btn-primary">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12L12 7.5 7.5 12M12 7.5V21" />
                </svg>
                Upload da foto
            </span>
        </label>

        <p class="mt-4 text-center text-xs text-muted">Formatos aceitos: JPG, PNG e HEIC</p>
    </main>

    <div class="fixed inset-x-0 bottom-0 z-40">
        <div class="relative mx-auto max-w-98">
            <nav class="h-18 bg-white/95 backdrop-blur-md border-t border-line rounded-t-3xl shadow-card flex items-center justify-around">
                <a href="./menu.html" class="flex flex-col items-center gap-1 w-20 text-muted transition-colors hover:text-royal-blue-700">
                    <span class="flex items-center justify-center w-12 h-7 rounded-full">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0" />
                        </svg>
                    </span>
                    <span class="text-[11px] font-semibold">Tutoriais</span>
                </a>

                <a href="./galeria.html" aria-current="page" class="flex flex-col items-center gap-1 w-20 text-royal-blue-700 transition-colors hover:text-royal-blue-800">
                    <span class="flex items-center justify-center w-12 h-7 rounded-full bg-royal-blue-100">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
                        </svg>
                    </span>
                    <span class="text-[11px] font-bold">Galeria</span>
                </a>

                <a href="#" class="flex flex-col items-center gap-1 w-20 text-muted transition-colors hover:text-royal-blue-700">
                    <span class="flex items-center justify-center w-12 h-7 rounded-full">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0zM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </span>
                    <span class="text-[11px] font-semibold">Perfil</span>
                </a>
            </nav>
        </div>
    </div>

    <div id="loading" class="hidden fixed inset-0 z-50 bg-royal-blue-1000/30 backdrop-blur-md" role="alertdialog" aria-live="polite" aria-label="Analisando sua foto">
        <div class="w-full h-full flex items-center justify-center px-5">
            <div class="w-full max-w-88 bg-white rounded-3xl shadow-card px-6 py-12 text-center">
                <div class="relative mx-auto w-20 h-20 mb-6">
                    <div class="absolute inset-0 rounded-full border-4 border-royal-blue-100 border-t-royal-blue-700 animate-spin" aria-hidden="true"></div>
                    <div class="absolute inset-3 rounded-full bg-royal-blue-100 flex items-center justify-center">
                        <svg class="w-6 h-6 text-royal-blue-700" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
                        </svg>
                    </div>
                </div>

                <h2 class="text-xl font-extrabold tracking-tight mb-1">Analisando sua foto</h2>
                <p class="text-sm text-muted leading-relaxed mb-8">A IA está processando sua imagem e preparando as sugestões.</p>

                <div class="flex items-center justify-between text-xs font-bold text-royal-blue-700 mb-2">
                    <span>Processando imagem...</span>
                    <span id="progress-label">0%</span>
                </div>

                <div class="w-full h-2.5 bg-royal-blue-100 rounded-full overflow-hidden">
                    <div id="progress" class="h-full w-0 rounded-full bg-linear-to-r from-royal-blue-700 to-royal-blue-400 transition-all duration-300"></div>
                </div>

                <p class="text-xs text-muted mt-4">Isso pode levar alguns segundos...</p>
            </div>
        </div>
    </div>

    <script src="../js/uploadImage.js"></script>
</body>
</html>
