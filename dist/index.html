<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modo Comida</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body class="bg-[#0D101A] font-['Poppins']">

    <!-- TELA -->
    <main class="min-h-screen w-full flex justify-center">

        <div class="w-full max-w-93.75 min-h-screen relative px-4 sm:px-7 py-7">

            <!-- BOTÃO VOLTAR -->
            <button
                class="w-[45px] h-[42px] rounded-full bg-white/20 flex items-center justify-center"
                aria-label="Voltar"
            >

                <svg
                    width="21"
                    height="21"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M19 12H5"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M11 6L5 12L11 18"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

            </button>


            <!-- CARD -->
            <section
                class="w-full max-w-[318px] mx-auto mt-[49px] bg-white rounded-[20px] px-4 pt-4 pb-[18px]"
            >

                <!-- CABEÇALHO -->
                <header class="flex items-center justify-between">

                    <!-- ÍCONE + TÍTULO -->
                    <div class="flex items-center gap-3">

                        <div
                            class="w-[33px] h-[30px] rounded-full bg-[#0445EA] flex items-center justify-center shrink-0"
                        >

                            <!-- ÍCONE DE COMIDA -->
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="M7 3V10"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M4 3V7C4 8.7 5.3 10 7 10C8.7 10 10 8.7 10 7V3"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M7 10V21"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M16 3V21"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M16 3C13.8 4.5 13 6.5 13 9C13 11 14.3 12 16 12"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </div>

                        <h1 class="text-[16px] leading-4 font-bold text-[#171616]">
                            MODO COMIDA
                        </h1>

                    </div>


                    <!-- STEP -->
                    <span
                        class="px-3 py-[2px] rounded-[10px] bg-[#757575]/20 text-[#757575] text-[8px] leading-4 font-bold whitespace-nowrap"
                    >
                        STEP 4/4
                    </span>

                </header>


                <!-- IMAGEM -->
                <div
                    class="relative w-full aspect-[285/338] mt-7 rounded-2xl overflow-hidden"
                >

                    <img
                        src="../images/comida.png"
                        alt="Tela do celular mostrando o Modo Comida"
                        class="w-full h-full object-cover"
                    >

                    <!-- DESTAQUE AZUL -->
                    <div
                        class="absolute w-[58px] h-[58px] rounded-full border-[5px] border-[#0445EA] left-[66%] top-[38%] -translate-x-1/2 -translate-y-1/2"
                    ></div>

                </div>


                <!-- INDICADORES -->
                <div class="flex justify-center gap-[5px] mt-3">

                    <span class="w-5 h-[5px] rounded-[5px] bg-[#D9D9D9]"></span>

                    <span class="w-5 h-[5px] rounded-[5px] bg-[#D9D9D9]"></span>

                    <span class="w-5 h-[5px] rounded-[5px] bg-[#D9D9D9]"></span>

                    <span class="w-5 h-[5px] rounded-[5px] bg-[#1A55EC]"></span>

                </div>


                <!-- TEXTO -->
                <div class="mt-[51px]">

                    <h2
                        class="text-[14px] leading-4 font-bold text-[#171616]"
                    >
                        Por onde acessar o Modo Comida?
                    </h2>


                    <p
                        class="mt-3 text-[12px] leading-[16.8px] font-medium text-[#171616]"
                    >
                        O Modo Comida está localizado na opção
                        <strong class="font-bold">Mais</strong>.
                        Para encontrá-lo, clique ou deslize a barra até essa
                        seção, onde será possível visualizar o ícone e o nome
                        do modo.
                    </p>

                </div>


                <!-- BOTÃO -->
                <button
                    class="w-full h-[42px] mt-[105px] rounded-[20px] bg-[#0445EA] text-white text-[16px] font-bold flex items-center justify-center"
                >
                    Finalizar
                </button>

            </section>

        </div>

    </main>

</body>

</html>
